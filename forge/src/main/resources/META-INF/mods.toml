modLoader = "javafml"
loaderVersion = "[47,)"
license = "AGPL-3.0-only"

[[mods]]
modId = "votifier_python_companion"
version = "${version}"
displayName = "Votifier Python Companion"
authors = "Mintack"
description = '''
Server-side companion mod for votifier-python that claims vote rewards via HTTP API and executes configured console reward commands.
'''
# Server-only mod: clients without it do not see the server as incompatible.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.votifier_python_companion]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.votifier_python_companion]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.votifier_python_companion]]
modId = "architectury"
mandatory = true
versionRange = "[9.2.14,)"
ordering = "AFTER"
side = "BOTH"
